name: Deploy Dev

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: recipelens-dev-rg
  AKS_CLUSTER_NAME: recipelens-dev-aks

  ACR_NAME: recipelensdevm7k2acr
  ACR_LOGIN_SERVER: recipelensdevm7k2acr.azurecr.io

  HELM_RELEASE: recipelens
  HELM_NAMESPACE: recipelens

  APP_URL: https://recipelens-demo.canadacentral.cloudapp.azure.com

jobs:
  deploy:
    name: Deploy to AKS Dev

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Resolve deployment SHA
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${{ github.sha }}"
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.vars.outputs.sha }}

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name "$ACR_NAME"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/recipelens/backend:${{ steps.vars.outputs.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/recipelens/frontend:${{ steps.vars.outputs.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Set up kubelogin
        uses: azure/use-kubelogin@v1.2
        with:
          kubelogin-version: v0.2.12

      - name: Set AKS context
        uses: azure/aks-set-context@v5
        with:
          resource-group: ${{ env.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}
          admin: "false"
          use-kubelogin: "true"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.36.4

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.22.0

      - name: Verify cluster access
        run: |
          kubectl get nodes
          kubectl get pods -n "$HELM_NAMESPACE"

      - name: Deploy with Helm
        run: |
          helm upgrade --install "$HELM_RELEASE" ./deploy/helm/recipelens \
            --namespace "$HELM_NAMESPACE" \
            --create-namespace \
            -f ./deploy/helm/recipelens/values-dev.yaml \
            --set-string backend.image.tag="${{ steps.vars.outputs.sha }}" \
            --set-string frontend.image.tag="${{ steps.vars.outputs.sha }}" \
            --atomic \
            --timeout 10m

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/recipelens-backend \
            -n "$HELM_NAMESPACE" \
            --timeout=5m

          kubectl rollout status deployment/recipelens-frontend \
            -n "$HELM_NAMESPACE" \
            --timeout=5m

          kubectl get pods -n "$HELM_NAMESPACE" -o wide

          kubectl get gateway,httproute \
            -n "$HELM_NAMESPACE"

      - name: Smoke test frontend
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --retry 10 \
            --retry-delay 5 \
            "$APP_URL/" \
            > /dev/null

      - name: Smoke test backend
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --retry 10 \
            --retry-delay 5 \
            "$APP_URL/api/v1/recipes" \
            > /dev/null

      - name: Deployment summary
        run: |
          echo "### RecipeLens Dev Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ steps.vars.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image tag: \`${{ steps.vars.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Namespace: \`$HELM_NAMESPACE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $APP_URL" >> "$GITHUB_STEP_SUMMARY"