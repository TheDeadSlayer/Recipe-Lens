apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "recipelens.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "recipelens.labels" . | nindent 4 }}
spec:
  gatewayClassName: approuting-istio

  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same