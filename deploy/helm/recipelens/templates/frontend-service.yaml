{{- /*
  Frontend ClusterIP Service.
  Exposes Nginx on port 80 → targetPort 8080.
  Stage 4F.1: ClusterIP only. An Ingress will be added in Stage 4F.2.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "recipelens.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "recipelens.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    {{- include "recipelens.frontend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.targetPort }}
      protocol: TCP
