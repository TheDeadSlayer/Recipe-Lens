{{- /*
  Backend ClusterIP Service.
  Exposes the Uvicorn application on port 80 → targetPort 8000.
  Stage 4F.1: ClusterIP only. An Ingress will be added in Stage 4F.2.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "recipelens.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "recipelens.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "recipelens.backend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}
      protocol: TCP
