apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "recipelens.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "recipelens.labels" . | nindent 4 }}

spec:
  parentRefs:
    - name: {{ include "recipelens.fullname" . }}-gateway

  hostnames:
    - recipelens-demo.canadacentral.cloudapp.azure.com

  rules:
    # API traffic goes directly to FastAPI.
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ include "recipelens.fullname" . }}-backend
          port: 80

    # Everything else goes to the React/Nginx frontend.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "recipelens.fullname" . }}-frontend
          port: 80