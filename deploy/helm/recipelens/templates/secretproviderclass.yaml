{{- /*
  SecretProviderClass — Azure Key Vault Secrets Store CSI driver.

  This resource instructs the CSI driver how to connect to Key Vault, which
  secrets to retrieve, and how to synchronize them into a Kubernetes Secret.

  Authorization model: Workload Identity (not the add-on's own identity).
    clientID references the RecipeLens workload UAMI client ID.
    The CSI driver exchanges the Pod's projected SA token (via OIDC) for an
    Azure AD access token scoped to the workload UAMI, which holds the
    Key Vault Secrets User role on this vault (Stage 4E).

  secretObjects synchronization:
    The `secretObjects` block causes the CSI driver to create and maintain a
    Kubernetes Secret (`recipelens-backend-secrets`) whose keys map exactly to
    the environment variable names the application already expects:
      DATABASE_URL   ← Key Vault secret: database-url
      GEMINI_API_KEY ← Key Vault secret: gemini-api-key

    IMPORTANT: the sync is only active while at least one Pod is mounting the
    associated CSI volume.  Both the backend Deployment and the migration Job
    mount the volume (even though they do not read the files directly) so that
    the sync lifecycle is maintained.

  objectEncoding: utf-8 is explicit to ensure the CSI driver reads the secret
  values as text strings rather than base64-encoded binary.
*/ -}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.secrets.providerClassName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "recipelens.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ required "azure.workloadIdentityClientId is required" .Values.azure.workloadIdentityClientId | quote }}
    keyvaultName: {{ required "azure.keyVaultName is required" .Values.azure.keyVaultName | quote }}
    tenantId: {{ required "azure.tenantId is required" .Values.azure.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: database-url
          objectType: secret
          objectEncoding: utf-8
        - |
          objectName: gemini-api-key
          objectType: secret
          objectEncoding: utf-8

  # secretObjects: sync Key Vault secrets into a Kubernetes Secret.
  # The CSI driver creates this Secret when a Pod mounts the CSI volume and
  # keeps its values in sync according to the rotation interval configured
  # on the AKS add-on (2 m in dev).
  #
  # Key mapping:
  #   Key Vault secret name   → Kubernetes Secret key (env var name)
  #   database-url            → DATABASE_URL
  #   gemini-api-key          → GEMINI_API_KEY
  secretObjects:
    - secretName: {{ .Values.secrets.secretName }}
      type: Opaque
      data:
        - objectName: database-url
          key: DATABASE_URL
        - objectName: gemini-api-key
          key: GEMINI_API_KEY
