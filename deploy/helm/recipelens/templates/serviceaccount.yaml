{{- /*
  ServiceAccount for the RecipeLens backend workload.

  The azure.workload.identity/client-id annotation binds this ServiceAccount
  to the RecipeLens workload UAMI via the AKS OIDC issuer and the Federated
  Identity Credential created in Stage 4E.

  Token exchange flow:
    1. AKS projects a signed ServiceAccount token into each Pod that uses
       this SA (audience: api://AzureADTokenExchange).
    2. The Azure Identity SDK exchanges the SA token for an Azure AD access
       token by calling the OIDC endpoint.
    3. Azure AD validates issuer + subject + audience against the FIC and
       returns an access token scoped to the workload UAMI.
    4. The CSI driver uses that token to read secrets from Key Vault.

  The frontend does not use Workload Identity and therefore does not use
  this ServiceAccount.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "recipelens.labels" . | nindent 4 }}
  annotations:
    # Binds this ServiceAccount to the RecipeLens workload UAMI.
    # Pods using this SA must also carry the label:
    #   azure.workload.identity/use: "true"
    azure.workload.identity/client-id: {{ required "azure.workloadIdentityClientId is required" .Values.azure.workloadIdentityClientId | quote }}
