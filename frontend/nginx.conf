server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── SPA routing ───────────────────────────────────────────────────────────
    # All requests that do not match a static file fall through to index.html
    # so React Router handles client-side navigation on refresh
    # (e.g. /recipes/:id does not 404).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching ──────────────────────────────────────────────────
    # Vite appends a content hash to JS/CSS filenames so 1-year immutable
    # caching is safe. Browsers re-fetch automatically on each deploy.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # NOTE: /api/ routing is NOT handled here.
    # In AKS: the Kubernetes Ingress routes /api/* to the backend Service.
    # In local production smoke tests: the docker-compose.prod.yml gateway
    #   service (Caddy) handles the split routing.
    # The frontend JavaScript uses relative /api/v1/... URLs in all environments.
}
