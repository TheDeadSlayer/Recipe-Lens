server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── API proxy → backend Service ───────────────────────────────────────────
    # Routes all /api/ requests to the backend Kubernetes Service.
    # Service DNS: recipelens-backend (ClusterIP, port 80 → backend:8000).
    #
    # This block is required for Stage 4F.1 (no Ingress yet): the React SPA
    # uses relative /api/v1/... URLs, so the browser sends them to whichever
    # host served the HTML — the frontend Service.  Nginx must proxy them
    # onward to the backend.
    #
    # When a proper Ingress is added (Stage 4F.2), this proxy can be kept
    # (defence-in-depth) or removed in favour of Ingress path rules — either
    # is valid.
    #
    # proxy_http_version 1.1 — use persistent connections to the upstream.
    # proxy_set_header Host — forward the original Host header.
    location /api/ {
        proxy_pass http://recipelens-backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SPA routing ───────────────────────────────────────────────────────────
    # All requests that do not match a static file fall through to index.html
    # so React Router handles client-side navigation on refresh
    # (e.g. /recipes/:id does not 404).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching ──────────────────────────────────────────────────
    # Vite appends a content hash to JS/CSS filenames so 1-year immutable
    # caching is safe. Browsers re-fetch automatically on each deploy.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
